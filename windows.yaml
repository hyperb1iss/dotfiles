# windows.yaml
# Dotbot configuration file for Windows setup

- defaults:
    link:
      create: true
      relink: true

- clean: ["~"]

- shell:
    # The skills hub has to exist before Claude Code can be linked at it
    - command:
        powershell.exe -NoProfile -Command "[void](New-Item -ItemType Directory -Force -Path $HOME/.agents/skills)"
      stdin: true
      stdout: true
      stderr: true
      description: Ensuring the ~/.agents skills hub exists

- link:
    # Starship prompt config comes from the SilkCircuit repo
    # (clone https://github.com/hyperb1iss/silkcircuit and run install.ps1)
    # Neovim configuration
    ~/AppData/Local/nvim: nvim
    # PowerShell profile
    ~/Documents/PowerShell/Microsoft.PowerShell_profile.ps1:
      path: hypershell/Microsoft.PowerShell_profile.ps1
      force: true
    # Git configuration
    ~/.gitconfig: gitconfig
    # Fastfetch configuration (Windows path)
    ~/AppData/Roaming/fastfetch/config.jsonc: fastfetch/config.jsonc
    # Claude Code configuration
    ~/.claude/statusline-command.sh: claude/statusline-command.sh
    # Claude Code / Codex agent files (from dotfiles-private).
    # dotbot runs `if` through cmd.exe here, so the guard must be cmd syntax; a
    # POSIX `[ -f ... ]` test always exits non-zero and skips the link in silence.
    # force is required because both destinations start life as regular files.
    ~/.claude/CLAUDE.md:
      path: ~/dev/dotfiles-private/ai/AGENTS.md
      force: true
      if: 'if exist "%USERPROFILE%\dev\dotfiles-private\ai\AGENTS.md" (exit 0) else (exit 1)'
    ~/.codex/AGENTS.md:
      path: ~/dev/dotfiles-private/ai/AGENTS.md
      force: true
      if: 'if exist "%USERPROFILE%\dev\dotfiles-private\ai\AGENTS.md" (exit 0) else (exit 1)'
    # ~/.agents/skills is the source of truth for agent skills. Codex scans it
    # natively; Claude Code reaches it through this link.
    ~/.claude/skills:
      path: ~/.agents/skills
      force: true

- shell:
    # Ensure fastfetch config directory exists on Windows
    - command:
        powershell.exe -NoProfile -Command "New-Item -ItemType Directory -Force -Path \"$Env:APPDATA\\fastfetch\" |
        Out-Null"
      stdin: true
      stdout: true
      stderr: true
      description: Create fastfetch config directory

    # Claude Code owns settings.json, so merge in the statusLine key rather than
    # linking the whole file
    - command: python ./claude/install-statusline.py
      stdin: true
      stdout: true
      stderr: true
      description: Wiring Claude Code status line

- shell:
    # Run the Windows setup script
    - command: powershell.exe -ExecutionPolicy Bypass -File ./hypershell/setup-windows.ps1
      stdin: true
      stdout: true
      stderr: true
      description: Running Windows setup script

    # Install Rust components
    - command: rustup component add rls rust-analysis rust-src
      stdin: true
      stdout: true
      stderr: true
      description: Installing Rust components

    # Install fastfetch (silent; ignore if already present)
    - command: powershell.exe -NoProfile -Command "winget install --id fastfetch-cli.fastfetch -e --silent; exit 0"
      stdin: true
      stdout: true
      stderr: true
      description: Installing fastfetch via winget

    # Install pynvim for Neovim Python support
    - command: pip install pynvim
      stdin: true
      stdout: true
      stderr: true
      description: Installing pynvim

    # Set WSL 2 as the default version
    - command: wsl --set-default-version 2
      stdin: true
      stdout: true
      stderr: true
      description: Setting WSL 2 as the default version
