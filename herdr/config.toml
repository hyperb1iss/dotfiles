# Herdr settings ⚡ the dotfiles-owned half of ~/.config/herdr/config.toml
#
# Herdr reads exactly one config.toml and cannot include another file, so
# bin/herdr-config composes this file with the SilkCircuit theme tables the
# installer drops beside it and writes the result into place. Edit here,
# then run `herdr-config` (or `make install`) to regenerate and reload.
#
# No [theme] table belongs in this file: the composer supplies it from the
# installer's silkcircuit-<variant>.toml, glow unless HERDR_THEME_VARIANT
# says otherwise. It is pinned rather than auto-switched because herdr
# trusts the appearance the terminal reports, and that came back light on
# a dark Mac.

onboarding = false

[terminal]
# New panes, tabs, and workspaces start where the source pane is.
new_cwd = "follow"

[worktrees]
# Checkouts land at <directory>/<repo>/<branch-slug>, the house lane.
directory = "~/dev/worktrees"

[session]
# Bring claude and codex panes back into their native conversations after
# a server restart. Needs the integrations from role/desktop.yaml.
resume_agents_on_restore = true

[keys]
# tmux stays on ctrl+b, so a tmux running inside a pane keeps its prefix.
prefix = "ctrl+a"

# Popups take every keystroke until the command exits, then vanish.
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+alt+s"
type = "popup"
command = "sibyl task list --status doing,blocked --all | less -R"
description = "sibyl: what every agent is on"
width = "90%"
height = "80%"

[[keys.command]]
key = "prefix+alt+t"
type = "popup"
command = "btop"
description = "btop"
width = "90%"
height = "90%"

# Plugin actions (plugins are installed by role/desktop.yaml from
# herdr/plugins.txt; moniker is linked from herdr/plugins/moniker).
[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "gh-pr.open-pr"
description = "open this branch's PR in the browser"

[[keys.command]]
key = "prefix+i"
type = "plugin_action"
command = "gh-pr.refresh"
description = "refresh PR status in the sidebar"

[[keys.command]]
key = "prefix+alt+n"
type = "plugin_action"
command = "nova.moniker.rename"
description = "moniker: name this tab again"

[[keys.command]]
key = "prefix+alt+r"
type = "plugin_action"
command = "persiyanov.reviewr.open"
description = "reviewr: diff and PR pane for this workspace"

[[keys.command]]
key = "prefix+alt+k"
type = "shell"
command = "herdr-k8s"
description = "k9s: one tab per cluster in the kubernetes workspace"

[ui]
# New tabs get a generated name instead of a prompt; rename later with
# prefix then shift+t, or `herdr tab rename`.
prompt_new_tab_name = false
# Attention queue: blocked agents float to the top of the sidebar.
agent_panel_sort = "priority"
status_indicators = "symbols"
show_agent_labels_on_pane_borders = true
window_title = "{hostname} · {workspace} · {tab}"
tab_bar_right = [
  { type = "zoom" },
  { type = "hostname" },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " · "

# Custom tokens vanish from the row while nothing has reported them:
#   $pr    PR number + CI state from the gh-pr plugin
#   $task  sibyl's active task, or anything that runs
#          herdr pane report-metadata <pane> --source user:sibyl --token task="..."
[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab", "$pr"], ["agent", "$task"]]

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.toast]
# Ghostty raises the desktop notification for background agents.
delivery = "terminal"

# Copy-on-select already happens silently; the "copied to clipboard"
# toast on every drag is noise.
[ui.toast.clipboard]
enabled = false

[ui.sound]
enabled = true
