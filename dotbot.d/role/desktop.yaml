# Desktop role: the workstation tooling that is the same on macOS and Linux.
#
# Anything with an OS-specific path lives in the os/ layer instead; this file
# is what a graphical machine gets regardless of which kernel it boots.
- defaults:
    link:
      relink: true
      create: true

# ~/.agents/skills is a link *target* below, so it has to exist as a real
# directory. `create: true` on a link only makes the link's parent.
- create:
    - ~/.agents/skills

# The SilkCircuit installer owns the themed tool configs (procs, fastfetch,
# lsd colors, the atuin theme) and will not create files inside a foreign
# git repo, so those paths must not resolve into this checkout. Dead links
# left by older installs are swept below; ~/.config/lsd was a directory
# link and is still alive, so it gets removed by name.
- clean:
    ~/.config:
      recursive: true
- shell:
    - command: "[ -L ~/.config/lsd ] && rm ~/.config/lsd || true"
      description: Retiring the ~/.config/lsd directory link
- link:
    ~/.fonts: fonts
    ~/.config/lsd/config.yaml: lsd/config.yaml
    ~/.config/atuin/config.toml: atuin/config.toml
    ~/.claude/statusline-command.sh: claude/statusline-command.sh
    # ~/.agents/skills is the source of truth for agent skills. Codex scans it
    # natively; Claude Code reaches it through this link.
    ~/.claude/skills:
      path: ~/.agents/skills
      force: true
    ~/.proto/.prototools: proto/.prototools
    # starship, bat, dircolors, and ghostty themes are installed by the
    # SilkCircuit installer in theme.yaml

- shell:
    - command: |
        # Refresh the font cache now that ~/.fonts points at the repo.
        # macOS only ships fc-cache when fontconfig comes in from Homebrew.
        if command -v fc-cache >/dev/null 2>&1; then
          fc-cache -f
        fi
      description: Rebuilding the font cache

    # Claude Code owns settings.json, so merge in the statusLine key rather than
    # linking the whole file
    - command: python3 ./claude/install-statusline.py
      stdout: true
      stderr: true
      description: Wiring Claude Code status line

    - command: |
        # Install proto version manager if not present
        if ! command -v proto &> /dev/null; then
          echo "✨ Installing proto version manager..."
          curl -fsSL https://moonrepo.dev/install/proto.sh | bash -s -- --yes
          export PROTO_HOME="$HOME/.proto"
          export PATH="$PROTO_HOME/shims:$PROTO_HOME/bin:$PATH"
        fi
        # Install node and npm via proto — versions are pinned by the
        # tracked proto/.prototools; running `proto pin` here would write
        # through the ~/.proto/.prototools symlink and dirty the repo
        if command -v proto &> /dev/null; then
          echo "📦 Setting up node and npm via proto..."
          proto install node
          proto install npm
        fi
      stderr: true
      stdout: true
      description: "Installing proto + node/npm"

    - command: |
        # Prefer a package-manager fzf, fall back to Go only when needed.
        if command -v fzf >/dev/null 2>&1; then
          echo "fzf already installed"
        elif command -v go >/dev/null 2>&1; then
          mkdir -p ~/dev/go && GOPATH=~/dev/go go install github.com/junegunn/fzf@latest
        else
          echo "Warning: fzf not found and go not available, skipping fzf install"
        fi
      stderr: true
      stdout: true
      description: Installing fzf

    - command: |
        # Herdr is the terminal workspace manager the agents run inside.
        # Its install script drops a self-updating binary in ~/.local/bin,
        # so `herdr update` owns upgrades from here and brew would only add
        # a second copy. The integrations are hook files it rewrites in
        # place, so rerunning them is a no-op; each is skipped when its
        # agent is absent so nothing creates an empty ~/.codex.
        if ! command -v herdr >/dev/null 2>&1; then
          echo "🎪 Installing herdr..."
          curl -fsSL https://herdr.dev/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
        fi
        if command -v herdr >/dev/null 2>&1; then
          if command -v claude >/dev/null 2>&1; then
            herdr integration install claude
          fi
          if command -v codex >/dev/null 2>&1; then
            herdr integration install codex
          fi
        fi
      stderr: true
      stdout: true
      description: "Installing herdr + agent integrations"

    - command: |
        # Marketplace plugins from herdr/plugins.txt, plus our own under
        # herdr/plugins/ linked in place. Both are idempotent against the
        # registered id list, and a plugin that fails to build says so
        # without failing the run: they are conveniences, not the install.
        if command -v herdr >/dev/null 2>&1; then
          have=$(herdr plugin list --json 2>/dev/null | jq -r '.result.plugins[].plugin_id' 2>/dev/null || true)
          grep -v '^\s*#' herdr/plugins.txt | while read -r path id _; do
            [ -n "$path" ] && [ -n "$id" ] || continue
            if printf '%s\n' "$have" | grep -qx "$id"; then
              echo "herdr plugin $id already installed"
            else
              herdr plugin install "$path" --yes || echo "herdr plugin $path failed, skipping"
            fi
          done
          for dir in herdr/plugins/*/; do
            id=$(awk -F'"' '/^id = /{print $2; exit}' "$dir/herdr-plugin.toml")
            if printf '%s\n' "$have" | grep -qx "$id"; then
              echo "herdr plugin $id already linked"
            else
              herdr plugin link "$(pwd)/$dir" || echo "herdr plugin link $dir failed, skipping"
            fi
          done
        fi
      stderr: true
      stdout: true
      description: "Installing herdr plugins"
