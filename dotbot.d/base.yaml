# Base layer: what every machine gets, on every OS and in every role.
#
# The Makefile composes layers as a single dotbot run:
#   base.yaml -> os/<os>.yaml -> role/<role>.yaml -> host/<host>.yaml
# Dotbot concatenates every -c file into one task list, so base runs first and
# the core links every later layer depends on are already in place by the time
# that layer is reached. theme.yaml closes the run: the SilkCircuit installer
# autodetects installed tools, so it goes after every package tier.
#
# `defaults` replaces rather than merges, and it carries across the file
# boundary because the configs are one list. Every layer therefore declares
# its own defaults block instead of inheriting whatever ran before it.
#
# force is per link, not global: it deletes whatever real file or directory
# squats the link path, so it is spent only on the paths that need it (the
# directory links, and ~/.zshrc, which gets backed up first below).
- defaults:
    link:
      relink: true
      create: true

# Exactly one clean pass for the whole composition.
- clean: ["~"]

# SilkCircuit decides whether Ghostty is installed by looking for this
# directory, and on macOS Ghostty is a cask with no binary on PATH, so the
# directory has to exist before theme.yaml runs the installer or the themes
# never land.
- create:
    - ~/.config/ghostty

- shell:
    - command: |
        # ~/.zshrc is force-linked below, so move a real one aside rather than
        # destroying it. pwd is the repo root: dotbot chdirs to -d before
        # running shell commands, which keeps this honest in a worktree.
        zshrc_target="$(pwd)/zsh/zshrc"
        zshrc_link="$HOME/.zshrc"
        if [ -e "$zshrc_link" ] || [ -L "$zshrc_link" ]; then
          if [ "$(readlink "$zshrc_link" 2>/dev/null || true)" != "$zshrc_target" ]; then
            backup_path="${zshrc_link}.pre-dotfiles.$(date +%Y%m%d%H%M%S)"
            mv "$zshrc_link" "$backup_path"
            echo "Backed up existing ~/.zshrc to $backup_path"
          fi
        fi
      stderr: true
      stdout: true
      description: Preparing Zsh configuration link

- link:
    ~/.bashrc.local: bash/bashrc.local
    ~/.gitconfig: gitconfig
    ~/.tmux.conf: tmux.conf
    ~/.zshrc:
      path: zsh/zshrc
      force: true
    ~/.config/nvim:
      path: nvim
      force: true
    ~/bin: bin
    ~/.tmux/plugins/tpm: tpm

- shell:
    - command: |
        # macOS bash reaches ~/.bashrc.local through the linked
        # ~/.bash_profile. Linux distros ship their own ~/.bashrc and never
        # look for it, so wire the hook in once, leaving the rest of the
        # file alone.
        if [ "$(uname -s)" != "Darwin" ]; then
          rc="$HOME/.bashrc"
          [ -f "$rc" ] || : > "$rc"
          if ! grep -q 'bashrc.local' "$rc"; then
            printf '\n# dotfiles hook\n[ -f ~/.bashrc.local ] && . ~/.bashrc.local\n' >> "$rc"
            echo "Wired ~/.bashrc.local into $rc"
          fi
        fi
      stdout: true
      description: Wiring ~/.bashrc.local into the login bash
