# Theme layer: the SilkCircuit installer, composed last on every machine.
#
# The installer autodetects which tools are present (bat, starship, ghostty,
# herdr, k9s, lazygit, git, and friends) and copies a theme in for each one
# it finds, so it has to run after every package tier: brew on macOS,
# pkg-sync and the cargo crates on Linux, proto and starship in the roles,
# and whatever dotfiles-private installs. Running it earlier on a fresh
# machine silently themes nothing.
#
# It also does `git config --global --add include.path`, which is why the
# ~/.gitconfig link lives in base.yaml: with the link already in place the
# installer writes through it into the tracked gitconfig, which carries the
# include already, so the step is a no-op there and idempotent on every run.
- defaults:
    link:
      relink: true
      create: true

- shell:
    - command: |
        if [ ! -d ~/dev/silkcircuit ]; then
          echo "🔮 Cloning SilkCircuit theme repo..."
          git clone https://github.com/hyperb1iss/silkcircuit ~/dev/silkcircuit
        fi
        (cd ~/dev/silkcircuit && ./install.sh -y)
      stderr: true
      stdout: true
      description: "Installing SilkCircuit themes"

    - command: |
        # Herdr reads one config.toml with no include mechanism, so the
        # tracked settings in herdr/ and the theme tables the installer
        # just dropped are composed into it here. See bin/herdr-config.
        bin/herdr-config
      stderr: true
      stdout: true
      description: "Composing herdr config"
