# Linux system layer: the sudo tier. Run on its own (`make system`, which
# `make full` calls first) because dotbot inherits root's HOME here and must
# not touch anything under the user's home directory.
- defaults:
    link:
      relink: true
      force: true

- shell:
    - command: |
        # System config ships as real files, never symlinks: /home is a
        # separate btrfs subvolume that isn't mounted when systemd-sysctl
        # and early udev run, so symlinks into the repo dangle at boot and
        # every setting silently fails. Re-run `make full` after editing.
        #
        # Remove dangling-at-boot symlinks from previous installs first so
        # install(1) can't write through them into the repo.
        for f in /lib/udev/rules.d/60-android.rules \
                 /lib/udev/rules.d/60-nvme-readahead.rules \
                 /lib/udev/rules.d/70-audio-power.rules \
                 /etc/sysctl.d/50-inotify.conf \
                 /etc/sysctl.d/80-desktop.conf \
                 /etc/sysctl.d/90-network.conf \
                 /etc/tmpfiles.d/80-desktop.conf \
                 /etc/ananicy.d/99-build-toolchain.rules; do
          [ -L "$f" ] && rm -f "$f"
        done
        # Retired no-op rule (set the kernel-default 128KB readahead) —
        # may exist as a real file from a pre-symlink install
        rm -f /etc/udev/rules.d/60-nvme-readahead.rules
        install -m0644 rules.d/60-android.rules rules.d/70-audio-power.rules /etc/udev/rules.d/
        install -m0644 sysctl.d/80-desktop.conf sysctl.d/90-network.conf /etc/sysctl.d/
        install -m0644 tmpfiles.d/80-desktop.conf /etc/tmpfiles.d/
        install -m0644 modules-load.d/bbr.conf /etc/modules-load.d/
        if [ -d /etc/ananicy.d ]; then
          install -m0644 ananicy.d/*.rules /etc/ananicy.d/
        fi
      stderr: true
      stdout: true
      description: "Installing system config as real files"

- shell:
    - command: |
        if command -v pacman >/dev/null 2>&1; then
          # Arch Linux setup
          sudo pacman -Syu --noconfirm
          # Install packages from list (failures will be non-fatal)
          grep -v '^#\|^$' packages_arch.txt | xargs -r sudo pacman -S --needed --noconfirm || true
        else
          # Ubuntu/Debian setup
          sudo add-apt-repository -y ppa:longsleep/golang-backports
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo add-apt-repository -y ppa:zhangsongcui3371/fastfetch
          sudo apt update
          # Per-package so one unavailable name can't sink the whole batch
          # (kubectl-on-noble class of failure)
          grep -v '^#\|^$' packages.txt | while read -r pkg; do
            sudo apt install -y --no-install-recommends "$pkg" || echo "⚠ skipped: $pkg"
          done
          # Rust toolchain + cargo tools are user-scope: the Linux layer
          # handles them so they land in ~/.cargo, not /root/.cargo.

          # Install Podman on Ubuntu/Debian (if not using Arch)
          if ! command -v podman >/dev/null 2>&1; then
            echo "Installing Podman..."
            sudo apt install -y podman podman-docker buildah skopeo
          fi
        fi
      stderr: true
      stdout: true
    - command: |
        if command -v update-alternatives >/dev/null 2>&1; then
          sudo update-alternatives --install /usr/bin/editor editor /usr/bin/nvim 60
          sudo update-alternatives --install /usr/bin/vim vim /usr/bin/nvim 60
        fi
      stderr: true
      stdout: true
    - command: |
        # Configure rootless Podman: UID/GID subordinate ranges
        if command -v podman >/dev/null 2>&1; then
          USER_NAME=$(logname 2>/dev/null || echo "$SUDO_USER")
          if [ -n "$USER_NAME" ]; then
            if ! grep -q "^${USER_NAME}:" /etc/subuid 2>/dev/null; then
              sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$USER_NAME"
              echo "Configured subuid/subgid ranges for $USER_NAME"
            fi
          fi
        fi
      stderr: true
      stdout: true
      description: "Configuring rootless container UID/GID mapping"
    - command: |
        # Install Docker Hub as default unqualified registry (system-wide)
        REGISTRY_CONF="/etc/containers/registries.conf.d/10-unqualified-search.conf"
        if [ ! -f "$REGISTRY_CONF" ]; then
          mkdir -p /etc/containers/registries.conf.d
          echo 'unqualified-search-registries = ["docker.io"]' > "$REGISTRY_CONF"
          echo "Configured Docker Hub as default registry"
        fi
      stderr: true
      stdout: true
      description: "Configuring container registry defaults"
    - command: |
        # Quiet the podman-docker "Emulate Docker CLI" banner
        if [ ! -f /etc/containers/nodocker ]; then
          touch /etc/containers/nodocker
          echo "Silenced podman-docker emulation banner"
        fi
      stderr: true
      stdout: true
      description: "Silencing podman-docker banner"
    - command: |
        # Install Kind for Kubernetes local clusters (not in official repos)
        if ! command -v kind >/dev/null 2>&1; then
          echo "Installing kind from GitHub releases..."
          KIND_VERSION="v0.31.0"
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) KIND_ARCH="amd64" ;;
            aarch64) KIND_ARCH="arm64" ;;
            *) echo "Unsupported architecture: $ARCH"; exit 0 ;;
          esac
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-${KIND_ARCH}"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          echo "kind ${KIND_VERSION} installed successfully"
        fi
      stderr: true
      stdout: true
      description: "Installing Kind for local Kubernetes clusters"
