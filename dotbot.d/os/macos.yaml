# macOS layer: Apple-only paths plus the Homebrew tier.
#
# Composed before theme.yaml, so every cask and formula brew installs here
# is on disk when the SilkCircuit installer autodetects what to theme. The
# installer also rebuilds the bat cache itself, so nothing here has to.
- defaults:
    link:
      relink: true
      create: true

- link:
    ~/.bash_profile: bash/bash_profile
    ~/.config/karabiner/karabiner.json: macos/karabiner.json
    # Ghostty reads both XDG and Application Support; use only XDG.
    ~/.config/ghostty/config: ghostty/config
    ~/.config/ghostty/macos.conf: ghostty/macos.conf

- shell:
    - command: |
        # Remove duplicate includes left by the old Application Support links.
        # Preserve real files and links managed outside this checkout.
        for name in config macos.conf; do
          ghostty_link="$HOME/Library/Application Support/com.mitchellh.ghostty/$name"
          ghostty_target="$(pwd)/ghostty/$name"
          if [ -L "$ghostty_link" ] && [ "$(readlink "$ghostty_link")" = "$ghostty_target" ]; then
            rm "$ghostty_link" || exit 1
          fi
        done
      description: Removing duplicate Ghostty configuration links

    - command: |
        # Install private fonts to macOS user font directory
        if [ -d "$HOME/dev/dotfiles-private/fonts" ]; then
          mkdir -p "$HOME/Library/Fonts"
          find "$HOME/dev/dotfiles-private/fonts" -type f \( -name '*.ttf' -o -name '*.otf' \) -exec cp -v {} "$HOME/Library/Fonts/" \;
          echo "✓ Private fonts installed to ~/Library/Fonts/"
        else
          echo "⚠️ dotfiles-private/fonts not found — skipping font install"
        fi
      stderr: true
      stdout: true
      description: Installing private fonts

    - command: |
        # Run macOS-specific setup script
        ./macos/brew.sh
      stderr: true
      stdout: true
      description: Installing Homebrew packages

    - command: |
        # Set up macOS-specific configurations
        if command -v brew >/dev/null 2>&1; then
          ./macos/macos_config.sh
        else
          echo "Warning: Homebrew not found, skipping macOS settings"
        fi
      stderr: true
      stdout: true
      description: Configuring macOS settings
