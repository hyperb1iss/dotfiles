[Modern CLI tools]
# Repo builds beat compiling, so pacman wins where it has them. On apt
# boxes the cargo crate is the fallback and only compiles when the
# binary is missing.
atuin                   desktop         pacman cargo
bat                     desktop         pacman cargo winget=sharkdp.bat
eza                     desktop         pacman winget=eza-community.eza
fd                      desktop         pacman cargo=fd-find winget=sharkdp.fd
git-delta               desktop         pacman cargo winget=dandavison.delta bin=delta
lsd                     desktop,server  apt@server pacman cargo@desktop winget=lsd-rs.lsd
procs                   desktop         pacman cargo winget=dalance.procs
ripgrep                 desktop         pacman cargo winget=BurntSushi.ripgrep.MSVC bin=rg
starship                desktop         pacman cargo winget=Starship.Starship
zoxide                  desktop,server  apt@server pacman cargo@desktop winget=ajeetdsouza.zoxide

