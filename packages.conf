# ╭──────────────────────────────────────────────────────────────╮
# │  packages.conf ⚡ one manifest for every package manager      │
# │  Resolved and installed by bin/pkg-sync                      │
# ╰──────────────────────────────────────────────────────────────╯
#
# One line per logical package. Columns are whitespace separated:
#
#   <name>  <roles>  <source> [<source> ...]  [# note]
#
#   name    the logical tool. Also the default package name for every
#           source on the line, so identical names need no repetition.
#   roles   comma list of roles the line applies to: desktop, server.
#   source  <manager>[=<package>][@<roles>], where manager is one of
#           apt, pacman, cargo, ppa. The optional =<package> renames the
#           package for that manager, the optional @<roles> narrows the
#           roles for that manager alone.
#
# A line may also carry `bin=<binary>` to name the executable a cargo
# crate installs, which is how pkg-sync decides a crate is already
# present. It defaults to the logical name.
#
# Sections are grouping and nothing more: pkg-sync ignores them.
#
# Example, read as "lsd is a desktop and server tool, apt only carries a
# usable one on servers, pacman has it everywhere, and desktops on apt
# fall back to the cargo crate":
#
#   lsd  desktop,server  apt@server pacman cargo@desktop
#
# macOS is deliberately absent. Homebrew already has a declarative
# manifest in macos/Brewfile with casks, taps, and mas entries that this
# format would flatten, so brew stays there. See macos/brew.sh.
#
#   bin/pkg-sync list apt server      # resolve without installing
#   bin/pkg-sync install pacman desktop --dry-run

[APT repositories]
# Ubuntu ships versions too old for the tools below, so the PPA goes in
# before the package does. Applied only on apt boxes.
golang-backports        desktop         ppa=ppa:longsleep/golang-backports
git-core                desktop,server  ppa=ppa:git-core/ppa
fastfetch               desktop         ppa=ppa:zhangsongcui3371/fastfetch

