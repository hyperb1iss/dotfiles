# Atuin configuration, SilkCircuit edition
#
# Only deliberate overrides live here. `atuin default-config` prints the full
# annotated template for the installed version when you need a key this file
# doesn't mention. Shell wiring (init, keybindings, helpers) is sh/atuin.sh.
# Symlinked to ~/.config/atuin/config.toml by dotbot; the init cache turns
# over automatically when this file changes.

## Locale and sync
dialect = "us"
timezone = "local"
auto_sync = true
sync_frequency = "5m"
sync_address = "https://api.atuin.sh"
# brew owns upgrades; keeps the "update available" nag out of the help row
update_check = false

## Search
# daemon-fuzzy is served from the daemon's hot in-memory index
search_mode = "daemon-fuzzy"
# up arrow narrows on exactly what you typed, no fuzzing
search_mode_shell_up_key_binding = "prefix"
# workspace = anywhere inside the current git repo; Ctrl-R cycles from there
filter_mode = "workspace"
filter_mode_shell_up_key_binding = "workspace"
workspaces = true

## Interface
style = "compact"
inline_height = 30
inline_height_shell_up_key_binding = 12
invert = false
show_preview = true
max_preview_height = 6
show_help = true
show_tabs = true
show_numeric_shortcuts = true
# ctrl-1..9 row picks; alt-N is a dead key on macOS
ctrl_n_shortcuts = true
exit_mode = "return-original"
# Enter runs the pick, Tab drops it into the buffer for editing
enter_accept = true
# after && || or |, the pick is appended instead of replacing the line
command_chaining = true
# emacs, not auto: a shell that inherits EDITOR=nvim starts zle in viins and
# auto would make ESC switch modes instead of closing the picker
keymap_mode = "emacs"
word_jump_mode = "emacs"
prefers_reduced_motion = false

## Recording
store_failed = true
# drops AWS keys, GitHub PATs, Slack tokens, Stripe keys before they're written
secrets_filter = true
# a leading space keeps a command off the record, same contract as bash
history_filter = ["^\\s"]

[stats]
common_subcommands = [
  "adb", "atuin", "brew", "cargo", "claude", "codex", "docker", "gh", "git",
  "go", "just", "kubectl", "make", "moon", "npm", "pnpm", "proto", "sibyl",
  "systemctl", "tmux", "uv", "uvx", "yarn",
]
common_prefix = ["sudo", "time", "nice"]
ignored_commands = ["cd", "ls", "ll", "la", "pwd", "clear", "exit", "z"]

[keys]
scroll_exits = true
exit_past_line_start = true
accept_past_line_end = true
accept_past_line_start = false
accept_with_backspace = false

[preview]
strategy = "auto"

[sync]
records = true

[daemon]
# background sync, WAL compaction, and the daemon-fuzzy index.
# autostart lets the CLI spawn it on first use; no launchd unit needed.
enabled = true
autostart = true
sync_frequency = 300

[search]
# Ctrl-R cycles these in order; workspace is skipped outside a git repo
filters = ["workspace", "directory", "host", "global"]
shells = "auto"

[tmux]
enabled = true
width = "85%"
height = "65%"

[ui]
columns = ["exit", "duration", "time", "command"]
syntax_highlight = true

[theme]
name = "silkcircuit-neon"

[dotfiles]
# this repo is the source of truth for aliases and env; atuin stays out
enabled = false

[ai]
# opt in: set true here and drop --disable-ai from sh/atuin.sh
enabled = false

[pty_proxy]
# experimental: popup search overlay and command output capture.
# re-execs the shell inside a proxy, so test under Ghostty and cmux first.
enabled = false
