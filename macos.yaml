- defaults:
    link:
      relink: true

- clean: ["~"]

- shell:
    - command: |
        # SilkCircuit theming is owned by its own repo + installer, which
        # detects apps and copies themes into place (bat, starship, ghostty,
        # dircolors, git include, k9s, and friends).
        if [ ! -d ~/dev/silkcircuit ]; then
          echo "🔮 Cloning SilkCircuit theme repo..."
          git clone https://github.com/hyperb1iss/silkcircuit ~/dev/silkcircuit
        fi
        (cd ~/dev/silkcircuit && ./install.sh -y)
      stderr: true
      stdout: true
      description: "Installing SilkCircuit themes"

# Create all config directories up front (before linking)
- shell:
    - command: |
        mkdir -p ~/.config/karabiner \
                 ~/.config/lsd ~/.config/nvim ~/.config/starship \
                 ~/.config/fastfetch ~/.config/procs \
                 ~/.config/ghostty \
                 ~/.config/atuin/themes \
                 ~/.tmux/plugins ~/.claude ~/.codex ~/.proto \
                 "$HOME/Library/Application Support/com.mitchellh.ghostty"
      stderr: true
      stdout: true
      description: Creating configuration directories
    - command: |
        zshrc_target="$HOME/dev/dotfiles/zsh/zshrc"
        zshrc_link="$HOME/.zshrc"
        if [ -e "$zshrc_link" ] || [ -L "$zshrc_link" ]; then
          if [ "$(readlink "$zshrc_link" 2>/dev/null || true)" != "$zshrc_target" ]; then
            backup_path="${zshrc_link}.pre-dotfiles.$(date +%Y%m%d%H%M%S)"
            mv "$zshrc_link" "$backup_path"
            echo "Backed up existing ~/.zshrc to $backup_path"
          fi
        fi
      stderr: true
      stdout: true
      description: Preparing Zsh configuration link

- link:
    ~/.bash_profile: bash/bash_profile
    ~/.bashrc.local: bash/bashrc.local
    ~/.config/lsd:
      path: lsd
      force: true
    ~/.fonts: fonts
    ~/.gitconfig: gitconfig
    ~/.tmux.conf: tmux.conf
    ~/.zshrc:
      path: zsh/zshrc
      force: true
    ~/.config/nvim:
      path: nvim
      force: true
    ~/bin: bin
    ~/.config/karabiner/karabiner.json: macos/karabiner.json
    ~/.tmux/plugins/tpm: tpm
    ~/.config/fastfetch/config.jsonc: fastfetch/config.jsonc
    ~/.config/procs/config.toml: procs/config.toml
    # starship, bat, dircolors, and ghostty themes are installed by the
    # SilkCircuit installer above
    ~/Library/Application Support/com.mitchellh.ghostty/config: ghostty/config
    ~/Library/Application Support/com.mitchellh.ghostty/macos.conf: ghostty/macos.conf
    ~/.claude/statusline-command.sh: claude/statusline-command.sh
    ~/.config/atuin/config.toml: atuin/config.toml
    ~/.config/atuin/themes/silkcircuit.toml: atuin/themes/silkcircuit.toml
    ~/.proto/.prototools: proto/.prototools
    ~/.claude/AGENTS.md:
      create: true
      path: ~/dev/dotfiles-private/ai/AGENTS.md
      if: "[ -f ~/dev/dotfiles-private/ai/AGENTS.md ]"
    ~/.codex/AGENTS.md:
      create: true
      path: ~/dev/dotfiles-private/ai/AGENTS.md
      if: "[ -f ~/dev/dotfiles-private/ai/AGENTS.md ]"

- shell:
    - command: |
        # Install private fonts to macOS user font directory
        if [ -d "$HOME/dev/dotfiles-private/fonts" ]; then
          mkdir -p "$HOME/Library/Fonts"
          find "$HOME/dev/dotfiles-private/fonts" -type f \( -name '*.ttf' -o -name '*.otf' \) -exec cp -v {} "$HOME/Library/Fonts/" \;
          echo "✓ Private fonts installed to ~/Library/Fonts/"
        else
          echo "⚠️ dotfiles-private/fonts not found — skipping font install"
        fi
      stderr: true
      stdout: true
      description: Installing private fonts

    - command: |
        # Run macOS-specific setup script
        ./macos/brew.sh
      stderr: true
      stdout: true
      description: Installing Homebrew packages

    - command: |
        if command -v bat >/dev/null 2>&1; then
          bat cache --build
        else
          echo "Warning: bat not found, skipping theme cache rebuild"
        fi
      description: Rebuilding bat theme cache
      stdout: true

    - command: |
        # Set up macOS-specific configurations
        if command -v brew >/dev/null 2>&1; then
          ./macos/macos_config.sh
        else
          echo "Warning: Homebrew not found, skipping macOS settings"
        fi
      stderr: true
      stdout: true
      description: Configuring macOS settings

- shell:
    - command: |
        # Install proto version manager if not present
        if ! command -v proto &> /dev/null; then
          echo "✨ Installing proto version manager..."
          curl -fsSL https://moonrepo.dev/install/proto.sh | bash -s -- --yes
          export PROTO_HOME="$HOME/.proto"
          export PATH="$PROTO_HOME/shims:$PROTO_HOME/bin:$PATH"
        fi
        # Install node and npm via proto — versions are pinned by the
        # tracked proto/.prototools; running `proto pin` here would write
        # through the ~/.proto/.prototools symlink and dirty the repo
        if command -v proto &> /dev/null; then
          echo "📦 Setting up node and npm via proto..."
          proto install node
          proto install npm
        fi
      stderr: true
      stdout: true
      description: Installing proto + node/npm

    - command: |
        # Prefer the Homebrew fzf, fall back to Go only when needed.
        if command -v fzf >/dev/null 2>&1; then
          echo "fzf already installed"
        elif command -v go >/dev/null 2>&1; then
          mkdir -p ~/dev/go && GOPATH=~/dev/go go install github.com/junegunn/fzf@latest
        else
          echo "Warning: fzf not found and go not available, skipping fzf install"
        fi
      stderr: true
      stdout: true
      quiet: false
      description: Installing fzf
