name: ⚡ Lint & Format

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # → Comprehensive linting and formatting checks
  lint-and-format:
    name: » Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: → Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false # Don't need submodules for linting

      - name: → Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: → Install lint tooling
        uses: taiki-e/install-action@v2
        with:
          tool: shellcheck,shfmt,selene,stylua

      - name: → Install markdownlint
        run: npm install -g markdownlint-cli

      - name: → Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      # pwsh ships on the runner image; the modules do not. Major versions
      # are pinned so an upstream release cannot turn a green branch red
      # without a commit here. Install-PSResource is the modern path and
      # Install-Module is the fallback for older PowerShell.
      - name: → Install PowerShell modules
        shell: pwsh
        run: |
          $modules = @(
            @{ Name = 'PSScriptAnalyzer'; Range = '[1.0.0,2.0.0)'; Min = '1.0.0'; Max = '1.999.999' }
            @{ Name = 'Pester';           Range = '[6.0.0,7.0.0)'; Min = '6.0.0'; Max = '6.999.999' }
          )
          foreach ($m in $modules) {
            if (Get-Command Install-PSResource -ErrorAction SilentlyContinue) {
              Install-PSResource -Name $m.Name -Version $m.Range -TrustRepository -Scope CurrentUser
            }
            else {
              Install-Module -Name $m.Name -MinimumVersion $m.Min -MaximumVersion $m.Max `
                -Force -SkipPublisherCheck -Scope CurrentUser
            }
          }
          Get-Module -ListAvailable -Name PSScriptAnalyzer, Pester |
            Select-Object Name, Version | Format-Table -AutoSize

      - name: → Run all linters
        run: |
          echo "» Running comprehensive linting..."
          make lint

      # Tests run against the committed tree, before the formatting check
      # rewrites anything under it.
      - name: → Run tests
        run: |
          echo "» Running tests..."
          make test

      - name: → Check formatting
        run: |
          echo "» Checking code formatting..."
          make format

          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Formatting issues found! Run 'make format' locally to fix."
            echo "! Files with formatting issues:"
            git status --porcelain
            echo ""
            echo "! Diff:"
            git diff
            exit 1
          fi

          echo "√ All files are properly formatted and linted!"
