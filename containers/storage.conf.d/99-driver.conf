# Podman 6+ loads .conf.d drop-ins AFTER the main storage.conf, so vendor
# drop-ins (Arch ships 00-storage-arch.conf) override our main file. This
# 99- drop-in outranks them lexicographically and is the authoritative
# driver selection. Keep in sync with containers/storage.conf.
[storage]
driver = "overlay"
graphroot = "/home/bliss/.local/share/containers/storage-overlay"
