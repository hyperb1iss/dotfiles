# Podman 6+ loads .conf.d drop-ins AFTER the main storage.conf, so vendor
# drop-ins (Arch ships 00-storage-arch.conf with driver = "overlay") silently
# override our main file. This 99- drop-in outranks them lexicographically.
# Keep in sync with containers/storage.conf; see man containers-config(5).
[storage]
driver = "btrfs"
