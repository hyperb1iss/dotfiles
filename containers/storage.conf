[storage]
# Overlay on btrfs backing: native rootless overlayfs + reflink copy-up.
# The btrfs graph driver is best-effort upstream and forecloses partial
# pulls/composefs (no differ interface) — migrated 2026-07-09.
# graphroot is overridden because the default path's db.sql pins the old
# btrfs driver (DB beats config); the old store stays there for rollback
# until post-soak cleanup. Keep in sync with storage.conf.d/99-driver.conf.
driver = "overlay"
graphroot = "/home/bliss/.local/share/containers/storage-overlay"

[storage.options.pull_options]
# zstd:chunked partial pulls + hard-link dedup; free optionality today,
# real wins as registries adopt zstd:chunked. convert_images deliberately
# off (CPU-expensive per pull).
enable_partial_images = "true"
use_hard_links = "true"
